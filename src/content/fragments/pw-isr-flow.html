<svg class="dg" viewBox="0 0 900 414" role="img" aria-label="Public pages with ISR. On every visit the EG CDN routes the request to the front end, where the page cache serves the page without rendering it. When an author publishes, a Contentful webhook tells Next.js, which marks the pages that use the entry. The next visit to a marked page has Next.js render it once from Contentful and store it in the page cache, which serves it from then on.">

        </marker>
        <marker id="pwisrs" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="var(--ink-soft)"/>
        </marker>
      </defs>

      <text x="450" y="51" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">on AWS</text>
      <rect x="560" y="14" width="150" height="46" rx="4" fill="var(--card)" stroke="var(--ok)"/>

      <line x1="265" y1="60" x2="265" y2="406" stroke="var(--rule)" stroke-dasharray="3 4"/>
      <line x1="450" y1="60" x2="450" y2="406" stroke="var(--rule)" stroke-dasharray="3 4"/>
      <line x1="635" y1="60" x2="635" y2="406" stroke="var(--rule)" stroke-dasharray="3 4"/>
      <line x1="820" y1="60" x2="820" y2="406" stroke="var(--rule)" stroke-dasharray="3 4"/>

      <line x1="639" y1="338" x2="814" y2="338" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#pwisra)"/>
      <circle cx="653" cy="338" r="9" fill="var(--accent)"/>
      <text x="653" y="341.5" font-size="10" font-weight="600" fill="var(--paper)" text-anchor="middle">7</text>
      <text x="739.5" y="331" font-size="10.5" fill="var(--ink)" text-anchor="middle">reads the content</text>
      <line x1="631" y1="368" x2="456" y2="368" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#pwisra)"/>
      <circle cx="617" cy="368" r="9" fill="var(--accent)"/>
      <text x="617" y="371.5" font-size="10" font-weight="600" fill="var(--paper)" text-anchor="middle">8</text>

      <line x1="446" y1="398" x2="86" y2="398" stroke="var(--ok)" stroke-width="1.8" marker-end="url(#pwisrg)"/>
      <circle cx="432" cy="398" r="9" fill="var(--ok)"/>
      <text x="432" y="401.5" font-size="10" font-weight="600" fill="var(--paper)" text-anchor="middle">9</text>
      <text x="253" y="391" font-size="10.5" fill="var(--ink)" text-anchor="middle">the new page, cached from now on</text>
    </svg>
