- id: Q23
  group: commercial
  question: Which Contentful tier and add-ons are assumed?
  detail: Several requested capabilities sit outside a base platform entitlement — scheduled publishing, workflows and tasks, multiple environments, SSO and RBAC, and in particular variant dimensions on an entry (CMS-31) and audience mapping (CMS-37), which are typically delivered by Contentful's personalisation product rather than core entries. What is licensed for the pilot?
  why: If personalisation isn't licensed, CMS-31 gets modelled by hand and the variant-explosion concern in CMS-45 becomes real during the pilot rather than after it.
  owner: EG procurement
