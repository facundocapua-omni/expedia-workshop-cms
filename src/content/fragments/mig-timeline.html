      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--warm)" stroke-width="1.5" opacity=".35"/>

  <text x="560" y="40" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">contract end − notice − negotiation</text>

  <line x1="850" y1="48" x2="850" y2="344" stroke="var(--flag)" stroke-width="2.5"/>

  <rect x="452" y="254" width="22" height="18" fill="var(--accent)" opacity=".22"/>

  <text x="774" y="325" font-size="11.5" font-weight="700" fill="var(--flag)">AEM off</text>

  <line x1="560" y1="214" x2="596" y2="214" stroke="var(--warm)" stroke-width="1.3"/>
  <rect x="596" y="198" width="240" height="84" rx="4" fill="var(--warm-soft)" stroke="var(--warm)"/>
  <text x="608" y="219" font-size="12" font-weight="700" fill="var(--warm)">At the checkpoint</text>
  <text x="608" y="237" font-size="11" fill="var(--ink)">business cases still to move?</text>
  <text x="608" y="255" font-size="11" fill="var(--ink-soft)"><tspan font-weight="600" fill="var(--ink)">yes:</tspan> negotiate a short extension</text>
  <text x="608" y="272" font-size="11" fill="var(--ink-soft)"><tspan font-weight="600" fill="var(--ink)">none:</tspan> AEM off as planned</text>

  <path d="M700,350 V356 H758 V350" fill="none" stroke="var(--ink-soft)"/>
  <text x="729" y="370" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">rollback</text>
  <text x="729" y="383" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">window</text>
  <path d="M762,350 V356 H850 V350" fill="none" stroke="var(--flag)"/>
