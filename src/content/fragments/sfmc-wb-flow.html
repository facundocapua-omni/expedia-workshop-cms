<svg class="dg" viewBox="0 0 900 392" role="img" aria-label="The send, end to end. Whenever content changes in Contentful, the Content Resolution API pushes all the content to a Marketing Object in SFMC. NBA tells SFMC to send an email, with a decision payload: opportunity Accelerator, metric 200%, content ID 12345. At send time SFMC reads the Marketing Object, replaces the variables with the values NBA sent, builds the email and sends it. Partner web reads the same content from the same API. When no variant can be served, the final message is the default content.">
      <defs>
        <marker id="wbfa" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/>
        </marker>
        <marker id="wbfw" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="var(--warm)"/>
        </marker>
        <marker id="wbfg" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="var(--ok)"/>
        </marker>
        <marker id="wbff" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="var(--flag)"/>
        </marker>
      </defs>

      <rect x="20" y="41" width="170" height="50" rx="4" fill="var(--warm-soft)" stroke="var(--warm)"/>
      <text x="105" y="63" font-size="12.5" font-weight="600" fill="var(--ink)" text-anchor="middle">NBA</text>
      <text x="105" y="80" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">decides the opportunity</text>

      <rect x="350" y="14" width="250" height="154" rx="6" fill="none" stroke="var(--flag)" stroke-dasharray="5 3"/>
      <text x="364" y="32" font-size="12.5" font-weight="600" fill="var(--ink)">SFMC</text>
      <rect x="370" y="44" width="210" height="44" rx="4" fill="var(--card)" stroke="var(--flag)"/>
      <text x="475" y="62" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Builds the email</text>
      <text x="475" y="79" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">replaces the variables</text>
      <rect x="370" y="118" width="210" height="40" rx="4" fill="var(--flag-soft)" stroke="var(--flag)"/>
      <text x="475" y="135" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Marketing Object</text>
      <text x="475" y="151" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">holds all the content</text>
      <line x1="475" y1="118" x2="475" y2="91" stroke="var(--flag)" stroke-width="1.5" marker-end="url(#wbff)"/>
      <text x="485" y="108" font-size="10" fill="var(--ink-soft)">reads it at send time</text>

      <rect x="720" y="41" width="160" height="50" rx="4" fill="var(--flag-soft)" stroke="var(--flag)"/>
      <text x="800" y="63" font-size="12.5" font-weight="600" fill="var(--ink)" text-anchor="middle">Email</text>
      <text x="800" y="80" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">to the partner</text>

      <rect x="340" y="206" width="250" height="50" rx="4" fill="var(--card)" stroke="var(--ok)" stroke-width="1.5"/>
      <text x="465" y="228" font-size="12.5" font-weight="600" fill="var(--ink)" text-anchor="middle">Content Resolution API</text>
      <text x="465" y="245" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">sends content to the channels</text>

      <rect x="720" y="206" width="160" height="50" rx="4" fill="var(--flag-soft)" stroke="var(--flag)"/>
      <text x="800" y="228" font-size="12.5" font-weight="600" fill="var(--ink)" text-anchor="middle">Partner web</text>
      <text x="800" y="245" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">same content</text>

      <rect x="380" y="330" width="170" height="50" rx="4" fill="var(--accent-soft)" stroke="var(--accent)"/>
      <text x="465" y="352" font-size="12.5" font-weight="600" fill="var(--ink)" text-anchor="middle">Contentful</text>
      <text x="465" y="369" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">proof points, merge tags</text>

      <line x1="190" y1="66" x2="367" y2="66" stroke="var(--warm)" stroke-width="1.5" marker-end="url(#wbfw)"/>
      <text x="279" y="57" font-size="10.5" fill="var(--ink)" text-anchor="middle">"send an email"</text>

      <rect x="20" y="115" width="170" height="88" rx="4" fill="var(--warm-soft)"/>
      <text x="32" y="133" font-size="10.5" font-weight="600" fill="var(--warm)">decision payload</text>
      <text x="32" y="153" font-size="10.5" fill="var(--ink)" font-family="var(--mono)">oppy · Accelerator</text>
      <text x="32" y="171" font-size="10.5" fill="var(--ink)" font-family="var(--mono)">metric · 200%</text>
      <text x="32" y="189" font-size="10.5" fill="var(--ink)" font-family="var(--mono)">content ID · 12345</text>
      <polyline points="190,159 232,159 232,70" fill="none" stroke="var(--warm)" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="240" y="106" font-size="10" fill="var(--ink-soft)">travels with</text>
      <text x="240" y="119" font-size="10" fill="var(--ink-soft)">the request</text>

      <line x1="580" y1="66" x2="717" y2="66" stroke="var(--flag)" stroke-width="1.5" marker-end="url(#wbff)"/>
      <text x="660" y="57" font-size="10.5" fill="var(--ink)" text-anchor="middle">sends it</text>

      <line x1="475" y1="206" x2="475" y2="161" stroke="var(--ok)" stroke-width="1.8" marker-end="url(#wbfg)"/>
      <text x="465" y="184" font-size="10.5" fill="var(--ink)" text-anchor="end">pushes all the content</text>
      <text x="465" y="198" font-size="10" fill="var(--ink-soft)" text-anchor="end">whenever content changes</text>

      <line x1="590" y1="231" x2="717" y2="231" stroke="var(--ok)" stroke-width="1.5" marker-end="url(#wbfg)"/>
      <text x="654" y="222" font-size="10.5" fill="var(--ink)" text-anchor="middle">same API</text>

      <line x1="465" y1="330" x2="465" y2="259" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#wbfa)"/>
      <text x="475" y="292" font-size="10.5" fill="var(--ink)">content change</text>
      <text x="475" y="306" font-size="10" fill="var(--ink-soft)">triggers the push</text>

      <rect x="20" y="314" width="300" height="66" rx="4" fill="var(--card)" stroke="var(--ink-soft)" stroke-dasharray="4 3"/>
      <text x="34" y="337" font-size="11.5" font-weight="600" fill="var(--ink)">Final message: default content</text>
      <text x="34" y="355" font-size="10.5" fill="var(--ink-soft)">when no variant can be served, the proof</text>
      <text x="34" y="370" font-size="10.5" fill="var(--ink-soft)">point's default copy is what goes out</text>
    </svg>
