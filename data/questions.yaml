# Q1–Q26 and Q6b (raised with EG) and DQ-1–DQ-10 (UC1 design).
# UC2 questions U1–U11 live in model/uc2-matrix.json because they feed the workbook.
# status: open | assumed | answered | closed. confirmedByEG becomes true once EG accepts the answer.
- id: Q1
  group: blocking
  question: Where does the personalised value actually live?
  detail: Is the proof-point value stored in Contentful per partner, or does Contentful hold a templated sentence with the value injected at render time from NBA or an SFMC data extension?
  why: CMS-10 describes a typed value field in the entry; the scale note anticipates a unique proof point across ~1M partner records. Those can't both be true in the same design. The answer sets the entry count, the content model, the licensing tier and whether Contentful sits in the per-recipient path at all.
  owner: EG architecture
  status: answered
  answer: Template with named variables in Contentful; value injected at resolution time
  confirmedByEG: false
- id: Q2
  group: blocking
  question: Who resolves the variant — NBA or Contentful?
  detail: Do the channels fetch a fully-resolved variant ID that NBA has already chosen, or a base ID plus segment/locale parameters that Contentful resolves on the way out?
  why: The parameters say NBA decides and mark CMS-37 out of scope, but CMS-31 and CMS-38 are scored on content "resolving" for a segment/tone combination. If Contentful resolves, audience mapping is in scope and the pilot is larger than described. Segment and tone are the only inputs to that resolution; channel is not one, and Q6b settles why.
  owner: EG
  status: answered
  answer: NBA selects from a variant index; Contentful never decides
  confirmedByEG: false
- id: Q3
  group: blocking
  question: One content ID across channels, or one per channel rendering?
  detail: Step 5 says every channel fetches the same ID; step 6 says a channel-specific variant of every proof point should be possible under the same base ID. Is the shared contract base_id, or base_id + channel?
  why: It determines what NBA hands off, what SFMC and CRM store on their records, and what "the same ID everywhere" is actually being proved.
  owner: EG
  status: answered
  answer: One reference; channel is a fetch parameter
  confirmedByEG: false
- id: Q4
  group: blocking
  question: What mechanism produces the channel-specific rendering automatically?
  detail: CMS-01 passes only if the channel rendering is generated from one base entry plus channel parameters. What is the expected mechanism, and what hand-authored reference will the output be compared against?
  why: There's no native "clone this entry by channel parameter" behaviour to point at. This becomes field-level conditions, referenced content types, or a custom app — each with different effort and different governance.
  owner: EG
  status: assumed
  position: "Channel profiles: each channel declares its audience and the length and markup its copy must fit, and the resolver shapes every variant by that profile. Only a variant that cannot fit a channel gets a hand-authored override, so the count of overrides is the CMS-01 result."
  confirmedByEG: false
- id: Q5
  group: blocking
  question: Where is the localised sentence assembled?
  detail: Should the API return a fully composed localised sentence with the metric inside it, or the message pattern plus parameters for the channel to compose?
  why: CMS-47 is the capability the document calls out as a genuine capability gain, not just efficiency. Plural, gender and ordinal handling normally resolves in the renderer, not the store — so if EG expects a composed sentence back, something has to inject and translate at request time, and that is a design decision, not a configuration one.
  owner: EG
  status: assumed
  position: "The Content Resolution API assembles it: plain substitution of the parameters into the localised message pattern (D-04, D-06)."
  confirmedByEG: false
- id: Q6
  group: blocking
  question: How does SFMC fetch at send time?
  detail: Per-recipient outbound calls from SFMC at send time, or a data extension hydrated before the send? Which SFMC modules are in play — Content Builder, Journey Builder — and are outbound calls permitted under EG's SFMC configuration?
  why: Per-recipient external calls at send time carry hard platform limits and are the usual failure point in this pattern at volume. Worth settling now rather than discovering it in the pilot.
  owner: EG marketing ops
  status: open
  confirmedByEG: false
- id: Q6b
  group: blocking
  question: Is tone a property of the partner or of the channel?
  detail: Step 5 has the CRM continuing the conversation in the same tone of voice the partner already received, which makes tone a partner attribute that persists across surfaces. CMS-01's "channel-specific content models" and step 6's "channel-specific variant" pull the other way. Which is it?
  why: If tone belongs to the partner, it is a selection criterion alongside segment and channel is only a rendering parameter. If tone belongs to the channel, CMS-19 loses half its pass condition because tone stops being decisioning metadata, CMS-31 collapses to segment alone, and CMS-06 becomes trivially satisfiable since no cross-channel constant remains. Three capability results move on this one answer.
  owner: EG
  status: open
  confirmedByEG: false
- id: Q7
  group: scope
  question: Are UC1 and UC2 one pilot or two tracks?
  detail: The capability matrix is written entirely from UC1's perspective and marks page-building capabilities as belonging to "the separate marketing-page CMS / replatform track" — while UC2, in the same document, is exactly that track. Same window, same team, same readout, or separate?
  owner: EG
  status: open
  confirmedByEG: false
- id: Q8
  group: scope
  question: Who builds the rendering layer for UC2?
  detail: '"Publish the page and it renders as designed" implies a front-end application, hosting, routing, CSS/JS and GTM wiring. Is EG providing an existing head to point at Contentful, or is building it part of the pilot?'
  why: This is the single largest effort variable in the document. A pilot that includes building a head is a different order of work from one that authors into an existing one.
  owner: EG + Globant
  status: answered
  answer: Globant, Next.js and Tailwind, in scope for the pilot
  confirmedByEG: true
