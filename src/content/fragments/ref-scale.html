<svg class="dg" viewBox="0 0 900 300" role="img" aria-label="Requests per second on a log scale, from 0.1 to 10,000. Reference middleware: usual traffic 0.3 to 1 request a second and daily peak 6.2, measured; estimated capacity of its one node 50 to 100. Content Resolution API, estimated: the burst after a 1M send with 10% engagement in an hour, about 30 on average and 300 at peak; with 20% engagement in ten minutes, about 330 on average and 1,000 at peak; one instance sustains 5,000 to 10,000.">
  <text x="10" y="22" font-size="12" font-weight="600" fill="var(--ink)">Requests per second, log scale</text>
  <text x="10" y="38" font-size="10.5" fill="var(--ink-soft)">the reference's traffic is measured; its capacity and the resolver are estimates</text>

  <line x1="290" y1="54" x2="290" y2="252" stroke="var(--rule)"/>
  <line x1="408" y1="54" x2="408" y2="252" stroke="var(--rule)"/>
  <line x1="526" y1="54" x2="526" y2="252" stroke="var(--rule)"/>
  <line x1="644" y1="54" x2="644" y2="252" stroke="var(--rule)"/>
  <line x1="762" y1="54" x2="762" y2="252" stroke="var(--rule)"/>
  <line x1="880" y1="54" x2="880" y2="252" stroke="var(--rule)"/>
  <line x1="290" y1="252" x2="880" y2="252" stroke="var(--ink-soft)" stroke-opacity=".5"/>
  <text x="290" y="268" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">0.1</text>
  <text x="408" y="268" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">1</text>
  <text x="526" y="268" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">10</text>
  <text x="644" y="268" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">100</text>
  <text x="762" y="268" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">1,000</text>
  <text x="876" y="268" font-size="10.5" fill="var(--ink-soft)" text-anchor="end">10,000</text>
  <text x="880" y="290" font-size="10.5" fill="var(--ink-soft)" text-anchor="end">requests per second →</text>

  <rect x="10" y="58" width="10" height="10" rx="2" fill="var(--warm)"/>
  <text x="26" y="67" font-size="11" font-weight="700" fill="var(--ink)">Reference middleware</text>

  <text x="26" y="92" font-size="11.5" fill="var(--ink)">Usual traffic</text>
  <g><title>Usual traffic: 20 to 60 requests a minute, 0.3 to 1 a second</title>
    <rect x="351" y="84" width="57" height="8" rx="4" fill="var(--warm)"/></g>
  <text x="416" y="92" font-size="10.5" fill="var(--ink-soft)">0.3–1</text>

  <text x="26" y="116" font-size="11.5" fill="var(--ink)">Daily peak</text>
  <g><title>Daily peak: 374 requests a minute, about 6.2 a second</title>
    <circle cx="501.7" cy="112" r="5" fill="var(--warm)" stroke="var(--card)" stroke-width="2"/></g>
  <text x="512" y="116" font-size="10.5" fill="var(--ink-soft)">6.2</text>

  <text x="26" y="140" font-size="11.5" fill="var(--ink)">Estimated capacity, one node</text>
  <g><title>Estimated capacity of the one node: 3,000 to 6,000 requests a minute, 50 to 100 a second</title>
    <rect x="608.5" y="132" width="35.5" height="8" rx="4" fill="var(--warm)"/></g>
  <text x="652" y="140" font-size="10.5" fill="var(--ink-soft)">50–100</text>

  <rect x="10" y="160" width="10" height="10" rx="2" fill="var(--accent)"/>
  <text x="26" y="169" font-size="11" font-weight="700" fill="var(--ink)">Content Resolution API, estimated</text>

  <text x="26" y="194" font-size="11.5" fill="var(--ink)">1M send, 10% engage in an hour</text>
  <g><title>Burst after a 1M send, 10% engagement over an hour: about 30 requests a second on average, 300 at peak</title>
    <rect x="582.3" y="186" width="118" height="8" rx="4" fill="var(--accent)"/></g>
  <text x="708" y="194" font-size="10.5" fill="var(--ink-soft)">~30 average, ~300 peak</text>

  <text x="26" y="218" font-size="11.5" fill="var(--ink)">1M send, 20% engage in ten minutes</text>
  <g><title>Burst after a 1M send, 20% engagement in ten minutes: about 330 requests a second on average, 1,000 at peak</title>
    <rect x="705.2" y="210" width="56.8" height="8" rx="4" fill="var(--accent)"/></g>
  <text x="697" y="218" font-size="10.5" fill="var(--ink-soft)" text-anchor="end">~330 average, ~1,000 peak</text>

  <text x="26" y="242" font-size="11.5" fill="var(--ink)">One instance, sustained</text>
  <g><title>One resolver instance, sustained: 5,000 to 10,000 requests a second</title>
    <rect x="844.5" y="234" width="35.5" height="8" rx="4" fill="var(--accent)"/></g>
  <text x="836" y="242" font-size="10.5" fill="var(--ink-soft)" text-anchor="end">5,000–10,000</text>
</svg>
