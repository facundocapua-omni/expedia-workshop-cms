<svg class="dg" viewBox="0 0 900 236" role="img" aria-label="A non-parity enhancement is made in Figma. If it does not change what a component is made of, it is a visual change: new design tokens, and every page restyles with its content untouched. If it does, it is a structural change: the component matrix and the content type are updated, and content moves once, into the enhanced model.">
      <defs>
        <marker id="pwbrs" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="var(--ink-soft)"/>
        </marker>
        <marker id="pwbrg" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="var(--ok)"/>
        </marker>
        <marker id="pwbrf" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="var(--flag)"/>
        </marker>
      </defs>

      <rect x="10" y="84" width="170" height="62" rx="4" fill="var(--warm-soft)" stroke="var(--warm)"/>
      <text x="26" y="109" font-size="12.5" font-weight="600" fill="var(--ink)">Non-parity enhancement</text>
      <text x="26" y="129" font-size="10.5" fill="var(--ink-soft)">a change made in Figma</text>
      <line x1="182" y1="115" x2="216" y2="115" stroke="var(--ink-soft)" stroke-width="1.4" marker-end="url(#pwbrs)"/>
      <rect x="220" y="76" width="210" height="78" rx="4" fill="var(--paper)" stroke="var(--ink-soft)" stroke-dasharray="4 3"/>
      <text x="325" y="106" font-size="10.5" fill="var(--ink)" text-anchor="middle" font-weight="600">Does it change what a</text>
      <text x="325" y="124" font-size="10.5" fill="var(--ink)" text-anchor="middle" font-weight="600">component is made of?</text>

      <path d="M430 104 L460 104 L460 40 L486 40" fill="none" stroke="var(--ok)" stroke-width="1.6" marker-end="url(#pwbrg)"/>
      <text x="470" y="72" font-size="10.5" fill="var(--ok)" font-weight="600">no</text>
      <path d="M430 126 L460 126 L460 190 L486 190" fill="none" stroke="var(--flag)" stroke-width="1.6" marker-end="url(#pwbrf)"/>
      <text x="470" y="166" font-size="10.5" fill="var(--flag)" font-weight="600">yes</text>

      <rect x="490" y="14" width="180" height="62" rx="4" fill="var(--ok-soft)" stroke="var(--ok)"/>
      <text x="506" y="39" font-size="12.5" font-weight="600" fill="var(--ink)">Visual change</text>
      <text x="506" y="59" font-size="10.5" fill="var(--ink-soft)">new design tokens</text>
      <line x1="672" y1="45" x2="706" y2="45" stroke="var(--ok)" stroke-width="1.4" marker-end="url(#pwbrg)"/>
      <rect x="710" y="14" width="180" height="62" rx="4" fill="var(--ok-soft)" stroke="var(--ok)"/>
      <text x="726" y="39" font-size="12.5" font-weight="600" fill="var(--ink)">Every page restyles</text>
      <text x="726" y="59" font-size="10.5" fill="var(--ink-soft)">content untouched</text>

      <rect x="490" y="160" width="180" height="62" rx="4" fill="var(--flag-soft)" stroke="var(--flag)"/>
      <text x="506" y="185" font-size="12.5" font-weight="600" fill="var(--ink)">Structural change</text>
      <text x="506" y="205" font-size="10.5" fill="var(--ink-soft)">matrix and content type updated</text>
      <line x1="672" y1="191" x2="706" y2="191" stroke="var(--flag)" stroke-width="1.4" marker-end="url(#pwbrf)"/>
      <rect x="710" y="160" width="180" height="62" rx="4" fill="var(--flag-soft)" stroke="var(--flag)"/>
      <text x="726" y="185" font-size="12.5" font-weight="600" fill="var(--ink)">Content moves once</text>
      <text x="726" y="205" font-size="10.5" fill="var(--ink-soft)">into the enhanced model</text>
    </svg>
