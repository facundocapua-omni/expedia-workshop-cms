<svg class="dg" viewBox="0 0 900 452" role="img" aria-label="The ramp of one business case. Left, routing at the edge: the CDN routes by path, then a sticky cohort cookie splits visitors of a ramping business case between AEM, the control cohort, and the new front end. Right, the share of visitors on the new front end: wave 0 internal, then 20%, 50% and 100%, each step ending with a go/no-go that EG signs. Content is frozen in both systems during the ramp; redirects are loaded inactive and switched on at 100%; AEM stays read-only for the rollback window, then its content is decommissioned. Rollback at any step is a routing change at the edge">

      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--warm)" stroke-width="1.5" opacity=".35"/>
    </pattern>
  </defs>

  <text x="84" y="117" font-size="13" font-weight="700" fill="var(--ink)">CDN, same domain</text>
  <text x="84" y="135" font-size="11" fill="var(--ink-soft)">DNS points here throughout</text>
  <line x1="185" y1="146" x2="185" y2="169" stroke="var(--ink-soft)" stroke-width="1.3" marker-end="url(#rpa-ar)"/>

  <rect x="70" y="172" width="230" height="46" rx="4" fill="var(--card)" stroke="var(--ink-soft)" stroke-opacity=".55"/>

  <text x="28" y="352" font-size="13" font-weight="700" fill="var(--warm)">AEM</text>

  <path d="M420,260 H480 V254 H550 V220 H620 V160 H690 V60 H880" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="412" y="64" font-size="11" fill="var(--ink-soft)" text-anchor="end">100%</text>

  <text x="515" y="227" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">EG and QA,</text>

  <text x="585" y="210" font-size="13" font-weight="700" fill="var(--accent)" text-anchor="middle">20%</text>
  <text x="655" y="150" font-size="13" font-weight="700" fill="var(--accent)" text-anchor="middle">50%</text>

  <text x="702" y="90" font-size="20" font-weight="700" fill="var(--accent)">100%</text>
  <text x="702" y="110" font-size="12.5" font-weight="600" fill="var(--ink)">New front end</text>
  <text x="702" y="138" font-size="10.5" fill="var(--ink)"><tspan fill="var(--ok)" font-weight="700">✓</tspan> redirects on</text>
  <text x="702" y="156" font-size="10.5" fill="var(--ink)"><tspan fill="var(--ok)" font-weight="700">✓</tspan> sitemap moved</text>
  <text x="702" y="174" font-size="10.5" fill="var(--ink)"><tspan fill="var(--ok)" font-weight="700">✓</tspan> Search Console notified</text>
  <text x="702" y="192" font-size="10.5" fill="var(--ink)"><tspan fill="var(--ok)" font-weight="700">✓</tspan> freeze lifted in Contentful</text>

  <polygon points="550,230 557,237 550,244 543,237" fill="var(--ok)" stroke="var(--card)" stroke-width="2"/>
  <polygon points="620,183 627,190 620,197 613,190" fill="var(--ok)" stroke="var(--card)" stroke-width="2"/>
  <polygon points="690,103 697,110 690,117 683,110" fill="var(--ok)" stroke="var(--card)" stroke-width="2"/>

  <line x1="680" y1="168" x2="680" y2="253" stroke="var(--flag)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#rpa-back)"/>

  <text x="412" y="363" font-size="11" font-weight="600" fill="var(--ink-soft)" text-anchor="end">Content</text>

  <text x="698" y="363" font-size="10.5" fill="var(--ok)">edited in Contentful</text>

  <text x="412" y="393" font-size="11" font-weight="600" fill="var(--ink-soft)" text-anchor="end">Redirects</text>
  <rect x="480" y="378" width="210" height="22" rx="3" fill="none" stroke="var(--ink-soft)" stroke-dasharray="3 3"/>
  <text x="490" y="393" font-size="10.5" fill="var(--ink-soft)">loaded at the CDN, inactive</text>
  <rect x="690" y="378" width="190" height="22" rx="3" fill="var(--ok-soft)" stroke="var(--ok)" stroke-opacity=".5"/>
  <text x="698" y="393" font-size="10.5" fill="var(--ok)">on: 301 and 410 (D-32)</text>
</svg>
